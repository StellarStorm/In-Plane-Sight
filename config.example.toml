# Copy to config.toml and edit. Every setting is optional; the values shown are
# the defaults. Any setting can be overridden at run time with an environment
# variable: IPS_ prefix and upper case, e.g.
#   IPS_RADIUS_NM=30  IPS_TIME_FORMAT=12  IPS_SWIFT_PASSWORD=...

# --- Search area ---
lat = 40.7128
lon = -74.0060
radius_nm = 20

# --- Aircraft data source ---
# "internet" uses adsb.fi, with adsb.lol as a fallback.
# "local" uses a running dump1090-fa or readsb receiver (RTL-SDR). It shows
# everything the receiver hears, whatever radius_nm is.
source = "internet"
local_url = "http://localhost:8080/data/aircraft.json"  # only used when source = "local"
refresh_seconds = 15

# --- Display ---
time_format = "24"        # "12" or "24"
font_thickness = "normal" # "normal" or "broad"
aircraft_type_format = "code" # "code" (e.g. B738) or "description" (e.g. BOEING 737-800)
flicker_enabled = true
flicker_strength = 0.1    # 0 to 0.4

# --- Server ---
host = "0.0.0.0"
port = 8000
log_level = "INFO"        # DEBUG, INFO, WARNING, ERROR or CRITICAL

# --- Tracking one flight (from /track) ---
# Tracking ends on its own after the flight lands, loses ADS-B, or runs too long.
[tracking]
arrived_minutes = 5  # stay on screen this long after landing
lost_minutes = 30    # give up after this long without ADS-B
max_hours = 24       # never track longer than this

# Optional FAA SWIFT/SCDS Flight FIXM route feed. Uncomment this section to
# enable it; queue, username and password are then required.
# [swift]
# host = "tcps://ems1.swim.faa.gov:55443"
# vpn = "FDPS"
# queue = ""
# username = ""
# password = ""
# route_ttl_hours = 20  # hours a route is kept after the FAA last updated it

# Optional FAA TFMS Flight Data feed, for the airline a regional flight flies
# for (e.g. Republic Airways flying as American Eagle). Uncomment to enable;
# queue, username and password are then required.
# [tfms]
# host = "tcps://ems1.swim.faa.gov:55443"
# vpn = "TFMS"
# queue = ""
# username = ""
# password = ""
