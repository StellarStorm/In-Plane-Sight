<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InPlaneSight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --board: #06070d;
        --frame: #171922;
        --white: #f4f5f7;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020308;
      }
      body {
        font-family: "Press Start 2P", monospace;
        color: var(--white);
      }
      #board {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-rows: minmax(0, 1fr) 31%;
        background-color: var(--board);
        background-image: radial-gradient(
          circle,
          rgba(28, 38, 78, 0.72) 0 1.45px,
          transparent 1.65px
        );
        background-size: 15px 15px;
        isolation: isolate;
      }
      #board::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 4px
        );
        mix-blend-mode: screen;
      }
      #main-display {
        min-height: 0;
        display: grid;
        grid-template-columns: 28.5% minmax(0, 1fr);
        gap: clamp(28px, 6vw, 96px);
        align-items: center;
        padding: clamp(18px, 2.4vw, 36px);
      }
      #logo-frame {
        width: 100%;
        aspect-ratio: 1/1;
        display: grid;
        place-items: center;
        background: transparent;
        border: 0;
        box-shadow: none;
        overflow: visible;
      }
      #airline-logo {
        display: none;
        width: 88%;
        height: 88%;
        transform-origin: center;
      }
      #plane-fallback {
        font-family: sans-serif;
        font-size: clamp(72px, 10vw, 150px);
        line-height: 1;
        color: rgba(136, 153, 212, 0.62);
        transform: rotate(-90deg);
      }
      #board.font-normal #callsign,
      #board.font-normal #aircraft-type,
      #board.font-normal #status-line,
      #board.font-normal #route-line,
      #board.font-normal .metric-label,
      #board.font-normal .metric-value {
        color: transparent;
        text-shadow: none;
      }
      .led-text-canvas {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        image-rendering: pixelated;
      }
      #board.font-broad #callsign,
      #board.font-broad #aircraft-type,
      #board.font-broad #status-line,
      #board.font-broad #route-line,
      #board.font-broad .metric-label,
      #board.font-broad .metric-value {
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        background-repeat: repeat;
        text-shadow: none;
      }
      #board.font-broad #callsign,
      #board.font-broad #route-line {
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.98) 0 38%,
          rgba(255, 255, 255, 0.16) 42%,
          transparent 48%
        );
        background-size: 10px 10px;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.22));
      }
      #board.font-broad #aircraft-type {
        background-image: radial-gradient(
          circle,
          rgba(159, 170, 255, 0.98) 0 38%,
          rgba(159, 170, 255, 0.15) 42%,
          transparent 48%
        );
        background-size: 8px 8px;
        filter: drop-shadow(0 0 5px rgba(148, 159, 255, 0.24));
      }
      #board.font-broad #status-line {
        background-image: radial-gradient(
          circle,
          rgba(150, 157, 178, 0.58) 0 36%,
          transparent 48%
        );
        background-size: 6px 6px;
      }
      #board.font-broad .metric-label {
        background-image: radial-gradient(
          circle,
          rgba(37, 103, 116, 0.92) 0 37%,
          transparent 49%
        );
        background-size: 6px 6px;
        filter: drop-shadow(0 0 4px rgba(40, 170, 190, 0.18));
      }
      #board.font-broad .metric-value {
        background-image: radial-gradient(
          circle,
          rgba(93, 242, 255, 0.98) 0 37%,
          rgba(93, 242, 255, 0.14) 42%,
          transparent 49%
        );
        background-size: 6px 6px;
        filter: drop-shadow(0 0 5px rgba(93, 242, 255, 0.3));
      }
      #flight-summary {
        min-width: 0;
        align-self: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(20px, 4vh, 48px);
        padding-right: clamp(10px, 4vw, 64px);
      }
      #callsign {
        overflow: hidden;
        font-size: clamp(44px, 7.4vw, 116px);
        line-height: 1.08;
        letter-spacing: 0.035em;
        white-space: nowrap;
        text-overflow: clip;
      }
      #route-line {
        overflow: hidden;
        font-size: clamp(44px, 7.4vw, 80px);
        line-height: 1.08;
        letter-spacing: 0.035em;
        white-space: nowrap;
        text-overflow: clip;
      }
      #aircraft-type {
        overflow: hidden;
        font-size: clamp(26px, 4.1vw, 64px);
        line-height: 1.1;
        letter-spacing: 0.035em;
        white-space: nowrap;
      }
      #status-line {
        overflow: hidden;
        font-size: clamp(15px, 2vw, 31px);
        line-height: 1.1;
        letter-spacing: 0.035em;
        white-space: nowrap;
      }
      #progress-bar {
        display: none;
        width: 100%;
        height: clamp(28px, 5vw, 70px);
      }
      #telemetry {
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        column-gap: clamp(18px, 4vw, 72px);
        align-items: center;
        padding: clamp(16px, 2.4vw, 36px);
        border-top: clamp(4px, 0.5vw, 8px) solid #11141d;
        background: rgba(2, 4, 10, 0.16);
      }
      .metric {
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: clamp(10px, 1.5vw, 25px);
        white-space: nowrap;
      }
      .metric-label,
      .metric-value {
        font-size: clamp(17px, 2.35vw, 38px);
        line-height: 1.18;
      }
      #empty {
        display: none;
        grid-column: 1/-1;
        align-self: center;
        justify-self: center;
        color: rgba(255, 255, 255, 0.22);
        font-size: clamp(18px, 2vw, 32px);
        letter-spacing: 0.12em;
      }
      #utility {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px clamp(16px, 2.4vw, 36px);
        border-top: 2px solid rgba(50, 75, 95, 0.42);
        background: rgba(3, 5, 10, 0.94);
        font-size: clamp(8px, 0.8vw, 12px);
        letter-spacing: 0.06em;
      }
      #status-info,
      #nav-links {
        display: flex;
        align-items: center;
        gap: clamp(14px, 2vw, 30px);
      }
      #status-info {
        color: rgba(93, 242, 255, 0.48);
      }
      #utility a {
        color: rgba(148, 159, 255, 0.72);
        text-decoration: none;
      }
      #utility a:hover {
        color: #f4f5f7;
      }
      /* addRenderer() tags both the text element and its LED canvas overlay
         (which lives outside #board) with these classes. #logo-frame is
         tagged in the markup so the icon dims along with the flight text. */
      .flicker-enabled .flicker-primary {
        animation: primary-led-flicker 4.7s steps(1, end) infinite;
      }
      .flicker-enabled .flicker-telemetry {
        animation: telemetry-led-flicker 5.9s steps(1, end) infinite;
      }
      /* With steps(1, end) each keyframe's value holds until the next one.
         Per cycle: one long dip, a quick double blink, and a softer sag. */
      @keyframes primary-led-flicker {
        0%,
        20%,
        53%,
        55.5%,
        84%,
        100% {
          opacity: 1;
        }
        17%,
        52%,
        54% {
          opacity: var(--flicker-low, 0.9);
        }
        80% {
          opacity: var(--flicker-soft, 0.95);
        }
      }
      @keyframes telemetry-led-flicker {
        0%,
        33%,
        67%,
        69.5%,
        94%,
        100% {
          opacity: 1;
        }
        30%,
        66%,
        68% {
          opacity: var(--flicker-mid, 0.945);
        }
        91% {
          opacity: var(--flicker-soft, 0.95);
        }
      }
      /* Small screens (phone portrait or landscape): put the utility bar in
         the page flow so it never covers the telemetry. */
      @media (max-width: 700px), (max-height: 500px) {
        html,
        body {
          height: 100dvh;
        }
        #progress-bar {
          height: 28px;
        }
        body {
          display: flex;
          flex-direction: column;
        }
        #board {
          flex: 1;
          min-height: 0;
          height: auto;
          width: 100%;
          background-size: 12px 12px;
        }
        #utility {
          position: static;
          min-height: 0;
          font-size: 9px;
        }
      }
      /* Phone landscape: keep the side-by-side layout but size by height.
         Chosen by orientation, not width, because many phones are under
         700px wide even when held sideways. */
      @media (max-height: 500px) and (orientation: landscape) {
        #main-display {
          gap: 5vw;
          padding: 3vh 4vw;
        }
        #logo-frame {
          max-width: 52vh;
          justify-self: center;
        }
        #plane-fallback {
          font-size: 30vh;
        }
        #flight-summary {
          gap: 3vh;
        }
        #callsign,
        #route-line {
          font-size: clamp(24px, 14vh, 116px);
        }
        #aircraft-type {
          font-size: clamp(14px, 7.5vh, 64px);
        }
        #status-line {
          font-size: clamp(10px, 4vh, 31px);
        }
        #telemetry {
          padding: 2vh 4vw;
          border-top-width: 4px;
        }
        #telemetry {
          column-gap: 3vw;
        }
        .metric {
          gap: 1vw;
        }
        .metric-label,
        .metric-value {
          font-size: clamp(9px, min(5vh, 1.9vw), 38px);
        }
      }
      /* Phone portrait: stack the logo above the flight details, and lay the
         telemetry out as a 2-column grid of label-over-value cells. */
      @media (max-width: 700px) and (orientation: portrait) {
        #board {
          grid-template-rows: minmax(0, 1fr) auto;
        }
        #main-display {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto;
          align-content: center;
          justify-items: center;
          gap: clamp(16px, 4vh, 40px);
          padding: 20px 16px;
        }
        #logo-frame {
          width: min(46vw, 28vh);
        }
        #plane-fallback {
          font-size: min(30vw, 18vh);
        }
        #flight-summary {
          width: 100%;
          align-items: center;
          gap: clamp(10px, 2.2vh, 24px);
          padding-right: 0;
        }
        #flight-summary > div {
          max-width: 100%;
        }
        #callsign,
        #route-line {
          font-size: clamp(24px, 10vw, 56px);
        }
        #aircraft-type {
          font-size: clamp(14px, 5.6vw, 32px);
        }
        #status-line {
          font-size: clamp(10px, 3.4vw, 18px);
        }
        #telemetry {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-rows: none;
          gap: clamp(12px, 2.4vh, 24px) 16px;
          padding: 16px 16px clamp(16px, 3vh, 28px);
          border-top-width: 4px;
        }
        .metric {
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }
        .metric:nth-child(5) {
          grid-column: 1 / -1;
        }
        .metric-label,
        .metric-value {
          font-size: clamp(11px, 4vw, 22px);
        }
        #empty {
          font-size: 12px;
          line-height: 1.6;
          text-align: center;
          padding: 12px 0;
        }
        #utility {
          flex-wrap: wrap;
          gap: 8px 16px;
          padding: 8px 16px;
        }
        #status-info {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }
        #nav-links {
          gap: 16px;
          margin-left: auto;
        }
        #utility a {
          padding: 6px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flicker-enabled .flicker-primary,
        .flicker-enabled .flicker-telemetry {
          animation: none;
        }
      }
    </style>
    </head>

    <body>
      <main id="board">
        <section id="main-display">
          <div id="logo-frame" class="flicker-primary">
          <canvas id="airline-logo" width="320" height="320" aria-label="Airline logo"></canvas><span
            id="plane-fallback">&#9992;</span>
          </div>
          <div id="flight-summary">
            <div id="callsign">------</div>
            <div id="aircraft-type">----</div>
            <div id="status-line"></div>
            <div id="route-line"></div>
            <canvas id="progress-bar" class="flicker-primary" aria-hidden="true"></canvas>
          </div>
          </section>
          <section id="telemetry">
        <div class="metric">
          <span class="metric-label">Alt:</span><span class="metric-value" id="s-alt">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">Spd:</span><span class="metric-value" id="s-spd">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">Dist:</span><span class="metric-value" id="s-dist">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">Trk:</span><span class="metric-value" id="s-trk">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">Vr:</span><span class="metric-value" id="s-vr">--</span>
        </div>
        <div id="empty">NO AIRCRAFT IN RANGE</div>
        </section>
        </main>
        <aside id="utility">
          <div id="status-info">
        <span id="aircraft-count">-- AIRCRAFT IN RANGE</span><span id="updated">UPDATED --</span>
        </div>
        <nav id="nav-links"><a href="/track">TRACK</a><a href="/list">LIST</a><a href="/map">MAP</a></nav>
        </aside>
        <script src="/static/common.js"></script>
        <script src="/static/js/airline-icons.js"></script>
        <script>
        // How much dimmer the weakest LED is than the brightest (0.18 = 18%).
        var LED_BRIGHTNESS_VARIATION = 0.18;
        var CENTER = null,
          prevIcao = null,
          ledTextRenderers = [],
          ledRenderPending = false,
          fontThickness = "normal",
          genericIcon = false,
          logoRequestId = 0,
          currentHeading = null,
          mainIcon = null,
          routeProgress = null;
        var G = {
          " ": ["00000", "00000", "00000", "00000", "00000", "00000", "00000"],
          "-": ["00000", "00000", "00000", "11111", "00000", "00000", "00000"],
          ".": ["00000", "00000", "00000", "00000", "00000", "00100", "00100"],
          ",": ["00000", "00000", "00000", "00000", "00100", "00100", "01000"],
          ":": ["00000", "00100", "00100", "00000", "00100", "00100", "00000"],
          "+": ["00000", "00100", "00100", "11111", "00100", "00100", "00000"],
          "/": ["00001", "00010", "00100", "01000", "10000", "00000", "00000"],
          ">": ["10000", "01000", "00100", "00010", "00100", "01000", "10000"],
          0: ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
          1: ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
          2: ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
          3: ["11110", "00001", "00001", "01110", "00001", "00001", "11110"],
          4: ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
          5: ["11111", "10000", "10000", "11110", "00001", "00001", "11110"],
          6: ["01110", "10000", "10000", "11110", "10001", "10001", "01110"],
          7: ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
          8: ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
          9: ["01110", "10001", "10001", "01111", "00001", "00001", "01110"],
          A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
          B: ["11110", "10001", "10001", "11110", "10001", "10001", "11110"],
          C: ["01111", "10000", "10000", "10000", "10000", "10000", "01111"],
          D: ["11110", "10001", "10001", "10001", "10001", "10001", "11110"],
          E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
          F: ["11111", "10000", "10000", "11110", "10000", "10000", "10000"],
          G: ["01111", "10000", "10000", "10111", "10001", "10001", "01111"],
          H: ["10001", "10001", "10001", "11111", "10001", "10001", "10001"],
          I: ["11111", "00100", "00100", "00100", "00100", "00100", "11111"],
          J: ["00111", "00010", "00010", "00010", "10010", "10010", "01100"],
          K: ["10001", "10010", "10100", "11000", "10100", "10010", "10001"],
          L: ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
          M: ["10001", "11011", "10101", "10101", "10001", "10001", "10001"],
          N: ["10001", "11001", "10101", "10011", "10001", "10001", "10001"],
          O: ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
          P: ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
          Q: ["01110", "10001", "10001", "10001", "10101", "10010", "01101"],
          R: ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
          S: ["01111", "10000", "10000", "01110", "00001", "00001", "11110"],
          T: ["11111", "00100", "00100", "00100", "00100", "00100", "00100"],
          U: ["10001", "10001", "10001", "10001", "10001", "10001", "01110"],
          V: ["10001", "10001", "10001", "10001", "10001", "01010", "00100"],
          W: ["10001", "10001", "10001", "10101", "10101", "10101", "01010"],
          X: ["10001", "10001", "01010", "00100", "01010", "10001", "10001"],
          Y: ["10001", "10001", "01010", "00100", "00100", "00100", "00100"],
          Z: ["11111", "00001", "00010", "00100", "01000", "10000", "11111"],
        };
        var ST = {
          callsign: {
            color: [255, 255, 255],
            scale: 0.84,
            radius: 0.24,
            glow: 1.2,
          },
          "aircraft-type": {
            color: [159, 170, 255],
            scale: 0.82,
            radius: 0.23,
            glow: 1,
          },
          "status-line": {
            color: [150, 157, 178],
            scale: 0.8,
            radius: 0.22,
            glow: 0.6,
            opacity: 0.58,
          },
          "route-line": {
            color: [255, 255, 255],
            scale: 0.84,
            radius: 0.24,
            glow: 1.2,
          },
          "metric-label": {
            color: [37, 103, 116],
            scale: 0.8,
            radius: 0.22,
            glow: 0.7,
            opacity: 0.92,
          },
          "metric-value": {
            color: [93, 242, 255],
            scale: 0.8,
            radius: 0.22,
            glow: 0.9,
          },
        };
        function addRenderer(el, name) {
          var c = document.createElement("canvas");
          c.className = "led-text-canvas";
          c.setAttribute("aria-hidden", "true");
          document.body.appendChild(c);
          var group = name.indexOf("metric-") === 0
            ? "flicker-telemetry"
            : "flicker-primary";
          el.classList.add(group);
          c.classList.add(group);
          ledTextRenderers.push({
            id: ledTextRenderers.length,
            element: el,
            canvas: c,
            style: ST[name],
          });
        }
        function initializeLedText() {
        addRenderer(callsign, "callsign");
        addRenderer(document.getElementById("aircraft-type"), "aircraft-type");
        addRenderer(document.getElementById("status-line"), "status-line");
        addRenderer(document.getElementById("route-line"), "route-line");
        document.querySelectorAll(".metric-label").forEach(function (e) {
          addRenderer(e, "metric-label");
        });
        document.querySelectorAll(".metric-value").forEach(function (e) {
          addRenderer(e, "metric-value");
        });
        scheduleLedTextRender();
      }
        // Shrink an element's font until its text fits on one line. Clearing
        // the inline size first lets the CSS size return when text gets shorter.
        function fitTextToWidth(el, minPx) {
          el.style.fontSize = "";
          var available = el.clientWidth,
            needed = el.scrollWidth;
          if (!available || needed <= available) return;
          var size = parseFloat(getComputedStyle(el).fontSize);
          el.style.fontSize =
            Math.max(minPx, Math.floor((size * available) / needed)) + "px";
        }
        function fitAircraftType() {
          fitTextToWidth(document.getElementById("aircraft-type"), 9);
        }
        var SUMMARY_LINES = ["callsign", "aircraft-type", "status-line", "route-line"];
        // The logo never shrinks below this when making room for the text.
        var MIN_LOGO_PX = 96;
        // If the logo and flight lines are taller than the space above the
        // telemetry (e.g. a phone, with a route showing), make them fit
        // rather than letting them overflow. A logo stacked above the text
        // shrinks first, so the LED lettering keeps its size.
        function fitSummaryHeight() {
          var box = document.getElementById("main-display"),
            summary = document.getElementById("flight-summary"),
            logo = document.getElementById("logo-frame"),
            logoWidth = logo.style.width;
          logo.style.width = "";
          for (var pass = 0; pass < 4; pass++) {
            var cs = getComputedStyle(box),
              available =
                box.clientHeight -
                parseFloat(cs.paddingTop) -
                parseFloat(cs.paddingBottom),
              s = summary.getBoundingClientRect(),
              l = logo.getBoundingClientRect(),
              used = Math.max(s.bottom, l.bottom) - Math.min(s.top, l.top),
              over = used - available;
            if (over <= 1 || s.height <= 0) break;
            var smaller = Math.max(MIN_LOGO_PX, Math.floor(l.width - over));
            if (l.bottom <= s.top && smaller < l.width - 1) {
              logo.style.width = smaller + "px";
              continue;
            }
            var ratio = Math.max(0.4, (s.height - over) / s.height);
            SUMMARY_LINES.forEach(function (id) {
              var el = document.getElementById(id),
                size = parseFloat(getComputedStyle(el).fontSize);
              el.style.fontSize = Math.max(8, Math.floor(size * ratio)) + "px";
            });
          }
          if (logo.style.width !== logoWidth) redrawLogo();
        }
        function fitHeadlineText() {
          fitTextToWidth(document.getElementById("status-line"), 8);
          fitTextToWidth(callsign, 16);
          fitTextToWidth(document.getElementById("route-line"), 16);
          fitAircraftType();
          fitSummaryHeight();
        }
        function scheduleLedTextRender() {
        if (fontThickness !== "normal") {
          ledTextRenderers.forEach(function (r) {
            r.canvas.style.display = "none";
          });
          return;
        }
        if (ledRenderPending) return;
        ledRenderPending = true;
        requestAnimationFrame(function () {
          ledRenderPending = false;
          ledTextRenderers.forEach(renderLedText);
        });
      }
        function renderLedText(r) {
          var e = r.element,
            c = r.canvas,
            s = r.style,
            cs = getComputedStyle(e),
            b = e.getBoundingClientRect();
          if (
            cs.display === "none" ||
            cs.visibility === "hidden" ||
            b.width <= 0 ||
            b.height <= 0
          ) {
            c.style.display = "none";
            return;
        }
        var t = String(e.textContent)
          .toUpperCase()
          .replace(/°/g, "")
          .replace(/[^A-Z0-9 +\-.,:/>]/g, " "),
          fs = parseFloat(cs.fontSize),
          m = document.createElement("canvas").getContext("2d");
        m.font = cs.font;
        var ls = parseFloat(cs.letterSpacing);
        if (!Number.isFinite(ls)) ls = 0;
        var sw = m.measureText(t).width + Math.max(0, t.length - 1) * ls,
          adv = t.length ? sw / t.length : 0,
          p = Math.min(
            Math.max(3, (fs * s.scale) / 7),
            adv ? adv / 6 : Infinity,
          ),
          // The 3px minimum pitch can make small text's letters taller
          // than its line, so the canvas grows evenly above and below
          // (with 2px for the glow) rather than cutting off the bottom rows.
          height = Math.max(b.height, 7 * p + 4),
          top = (height - 7 * p) / 2,
          ratio = devicePixelRatio || 1;
        c.style.cssText +=
          ";display:block;left:" +
          b.left +
          "px;top:" +
          (b.top - (height - b.height) / 2) +
          "px;width:" +
          b.width +
          "px;height:" +
          height +
          "px";
        c.width = Math.max(1, Math.ceil(b.width * ratio));
        c.height = Math.max(1, Math.ceil(height * ratio));
        var o = c.getContext("2d");
        o.setTransform(ratio, 0, 0, ratio, 0, 0);
        o.clearRect(0, 0, b.width, height);
        var opacity = s.opacity == null ? 1 : s.opacity,
          rad = Math.max(1.25, p * s.radius),
          color = s.color;
        for (var i = 0; i < t.length; i++) {
          var glyph = G[t[i]] || G[" "],
            cursor = i * adv;
          for (var y = 0; y < 7; y++)
            for (var x = 0; x < 5; x++)
              if (glyph[y][x] === "1") {
                o.save();
                o.globalAlpha =
                  opacity *
                  InPlaneSightAirlines.ledBrightness(
                    r.id,
                    i * 6 + x,
                    y,
                    LED_BRIGHTNESS_VARIATION,
                  );
                o.fillStyle = "rgb(" + color.join(",") + ")";
                o.shadowColor = "rgba(" + color.join(",") + ",.26)";
                o.shadowBlur = s.glow;
                o.beginPath();
                o.arc(
                  cursor + x * p + p / 2,
                  top + y * p + p / 2,
                  rad,
                  0,
                  Math.PI * 2,
                );
                o.fill();
                o.restore();
              }
        }
      }
        // A plane seen from above, nose right: tail fins, swept wings.
        var PLANE = [
            "0010000",
            "0011000",
            "1001100",
            "1111111",
            "1001100",
            "0011000",
            "0010000",
            ];
            // An LED line from origin to destination with the plane on it: the
            // flown part brightens toward the plane, the rest stays dim.
        function drawProgress() {
          var c = document.getElementById("progress-bar");
          if (routeProgress == null) {
            c.style.display = "none";
            return;
          }
          c.style.display = "block";
          var w = c.clientWidth,
            h = c.clientHeight,
            ratio = devicePixelRatio || 1,
            p = h / PLANE.length,
            columns = Math.floor(w / p),
            halfWidth = Math.floor(PLANE[0].length / 2),
            halfHeight = Math.floor(PLANE.length / 2),
            planeX =
              halfWidth +
              Math.round(routeProgress * (columns - 1 - 2 * halfWidth)),
            o = c.getContext("2d");
          c.width = Math.ceil(w * ratio);
          c.height = Math.ceil(h * ratio);
          o.setTransform(ratio, 0, 0, ratio, 0, 0);
          o.clearRect(0, 0, w, h);
          function dot(x, y, color, alpha, size, glow) {
            o.globalAlpha =
              alpha *
              InPlaneSightAirlines.ledBrightness(99, x, y, LED_BRIGHTNESS_VARIATION);
            o.fillStyle = "rgb(" + color + ")";
            o.shadowColor = "rgba(" + color + ",.45)";
            o.shadowBlur = glow;
            o.beginPath();
            o.arc(x * p + p / 2, y * p + p / 2, Math.max(1, p * size), 0, Math.PI * 2);
            o.fill();
          }
          for (var x = 0; x < columns; x++) {
            // One dark column either side keeps the plane's outline clear.
            if (Math.abs(x - planeX) <= halfWidth + 1) continue;
            if (x < planeX)
              dot(x, halfHeight, "93,242,255", 0.5 + 0.5 * (x / planeX), 0.3, 4);
            else dot(x, halfHeight, "60,74,115", 0.9, 0.26, 0);
          }
          PLANE.forEach(function (line, py) {
            for (var px = 0; px < line.length; px++)
              if (line[px] === "1")
                dot(
                  planeX - halfWidth + px,
                  py,
                  "255,255,255",
                  1,
                  0.36,
                  5,
                );
          });
        }
        function showFallback(h) {
          genericIcon = false;
          mainIcon = null;
          airlineLogo.style.display = "none";
          planeFallback.style.display = "block";
          planeFallback.style.transform = "rotate(" + ((h || 0) - 90) + "deg)";
        }
        var airlineLogo = document.getElementById("airline-logo"),
          planeFallback = document.getElementById("plane-fallback"),
          callsign = document.getElementById("callsign");
          function updateLogo(cs, h, category, majorCarrier) {
          var requestId = ++logoRequestId;
          currentHeading = h;
          genericIcon = false;
          mainIcon = null;
          planeFallback.style.display = "none";
          airlineLogo.style.display = "block";
          airlineLogo.style.visibility = "hidden";
          airlineLogo.style.transform = "none";
          if (InPlaneSightAirlines.isHelicopter(category)) {
            InPlaneSightAirlines.load("HELI").then(function (icon) {
              if (requestId !== logoRequestId) return;
              if (!icon) {
                showFallback(null);
                return;
              }
              renderMainIcon(icon, 0);
            });
            return;
          }
          InPlaneSightAirlines.getIcon(cs, majorCarrier).then(function (icon) {
            if (requestId !== logoRequestId) return;
            if (icon) {
            genericIcon = false;
            renderMainIcon(icon, 0);
            return;
          }
          InPlaneSightAirlines.load("GENERIC").then(function (g) {
            if (requestId !== logoRequestId) return;
            if (!g) {
              showFallback(currentHeading);
              return;
            }
            genericIcon = true;
            renderMainIcon(g, currentHeading);
          });
        });
      }
        function renderMainIcon(icon, rotation) {
          InPlaneSightAirlines.render(airlineLogo, icon, {
            dotScale: 0.58,
            showOffLeds: false,
            glow: true,
            brightnessVariation: LED_BRIGHTNESS_VARIATION,
          });
        airlineLogo.style.transform =
          "rotate(" + (rotation != null ? rotation : 0) + "deg)";
        airlineLogo.style.visibility = "visible";
        airlineLogo.setAttribute("aria-label", icon.label);
        mainIcon = icon;
      }
        // The canvas bitmap is sized when drawn, so redraw it at the new
        // size rather than letting CSS stretch it.
        function redrawLogo() {
          if (mainIcon) renderMainIcon(mainIcon, genericIcon ? currentHeading : 0);
        }
        function distanceNm(a, b, c, d) {
          var R = 3440.065,
            x = ((c - a) * Math.PI) / 180,
            y = ((d - b) * Math.PI) / 180,
            v =
              Math.sin(x / 2) ** 2 +
              Math.cos((a * Math.PI) / 180) *
              Math.cos((c * Math.PI) / 180) *
              Math.sin(y / 2) ** 2;
          return R * 2 * Math.atan2(Math.sqrt(v), Math.sqrt(1 - v));
        }
        function showEmpty() {
          document.getElementById("main-display").style.visibility = "hidden";
          document.querySelectorAll(".metric").forEach(function (e) {
            e.style.display = "none";
          });
          document.getElementById("empty").style.display = "block";
          prevIcao = null;
          logoRequestId += 1;
          currentHeading = null;
          genericIcon = false;
          mainIcon = null;
          scheduleLedTextRender();
        }
        function render(ac) {
          if (!ac.length) {
            routeProgress = null;
            showEmpty();
            return;
          }
          routeProgress = ac[0].progress;
          showFlight(ac[0], "", logoKeyFor(ac[0]));
        }
        // Includes the airline codes and helicopter flag, as a callsign,
        // major carrier or category can arrive after the aircraft is first
        // seen.
        function logoKeyFor(a) {
          return [
            a.icao,
            InPlaneSightAirlines.getCode(a.callsign) || "",
            a.major_carrier || "",
            InPlaneSightAirlines.isHelicopter(a.category),
          ].join(":");
        }
        function trackStatus(t) {
          if (t.status === "airborne" && t.phase) return t.phase.toUpperCase();
          return (
            {
              waiting: "WAITING",
              airborne: "AIRBORNE",
              on_ground: "ON GROUND",
              signal_lost: "SIGNAL LOST",
              arrived: "ARRIVED",
            }[t.status] || ""
          );
        }
        function renderTracked(t) {
          var a = t.aircraft || { icao: "" };
          a.callsign = t.callsign;
          routeProgress = t.progress;
          a._dist =
            CENTER && a.lat != null
              ? distanceNm(CENTER[0], CENTER[1], a.lat, a.lon)
              : null;
          showFlight(
            a,
            "TRACKING - " + trackStatus(t),
            "track:" + logoKeyFor(a),
          );
        }
        // The logo is reloaded only when logoKey changes.
        function showFlight(a, infoLine, logoKey) {
        document.getElementById("main-display").style.visibility = "visible";
        document.querySelectorAll(".metric").forEach(function (e) {
          e.style.display = "flex";
        });
        document.getElementById("empty").style.display = "none";
        currentHeading = a.heading;
        callsign.textContent = a.callsign || a.icao.toUpperCase();
        document.getElementById("aircraft-type").textContent =
          InPlaneSight.aircraftType(a) || (a.icao ? "UNKNOWN" : "----");
        // Only a tracked flight has a status to show.
        var statusLine = document.getElementById("status-line");
        statusLine.textContent = infoLine;
        statusLine.style.display = infoLine ? "" : "none";
        document.getElementById("s-alt").textContent =
          a.altitude_ft != null
            ? (a.altitude_ft / 1000).toFixed(1) + "k ft"
            : "--";
        document.getElementById("s-spd").textContent =
          a.speed_kts != null ? a.speed_kts + " kt" : "--";
        document.getElementById("s-dist").textContent =
          a._dist != null ? Math.round(a._dist) + " nm" : "--";
        document.getElementById("s-trk").textContent =
          a.heading != null ? Math.round(a.heading) + "°" : "--";
        document.getElementById("s-vr").textContent =
          a.vertical_rate_fpm != null
            ? (a.vertical_rate_fpm >= 0 ? "+" : "") +
            Math.round(a.vertical_rate_fpm) +
            " ft/m"
            : "--";
        document.getElementById("route-line").textContent =
          a.origin && a.destination
          ? (a.origin_display || a.origin) + "-" +
              (a.destination_display || a.destination)
            : "";
        drawProgress();
        fitHeadlineText();
        scheduleLedTextRender();
        if (logoKey !== prevIcao) {
          updateLogo(a.callsign, a.heading, a.category, a.major_carrier);
          prevIcao = logoKey;
        } else if (genericIcon) {
          airlineLogo.style.transform = "rotate(" + (a.heading || 0) + "deg)";
        } else if (planeFallback.style.display !== "none") {
          planeFallback.style.transform =
            "rotate(" + ((a.heading || 0) - 90) + "deg)";
        }
      }
        function showOverhead(ac) {
          ac.forEach(function (a) {
            a._dist = CENTER
              ? distanceNm(CENTER[0], CENTER[1], a.lat, a.lon)
              : null;
          });
          ac.sort(function (a, b) {
            return (a._dist || 9999) - (b._dist || 9999);
          });
          render(ac);
          document.getElementById("aircraft-count").textContent =
            ac.length + " AIRCRAFT IN RANGE";
        }
        // A failed poll leaves the last view on screen; /aircraft is only
        // needed when no flight is tracked.
        function fetchAircraft() {
          InPlaneSight.fetchJson("/tracking")
            .then(function (tracked) {
              if (!tracked.tracking) {
                return InPlaneSight.fetchJson("/aircraft").then(showOverhead);
              }
              renderTracked(tracked);
              document.getElementById("aircraft-count").textContent =
                "TRACKING " + tracked.callsign;
            })
            .then(function () {
              document.getElementById("updated").textContent =
                "UPDATED " + InPlaneSight.formatTime(new Date());
            })
            .catch(function (e) {
              document.getElementById("updated").textContent = "FETCH FAILED";
              console.error(e);
            });
        }
        // Drop ?track= from the address so a reload doesn't restart old tracking.
        function startTrackingFromUrl() {
          var params = new URLSearchParams(location.search),
            flight = params.get("track");
          if (!flight) return Promise.resolve();
          params.delete("track");
          var query = params.toString();
          history.replaceState(
            null,
            "",
            location.pathname + (query ? "?" + query : "") + location.hash,
          );
          return fetch("/tracking", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ flight: flight }),
          })
            .then(function (r) {
              if (!r.ok) {
                return r.json().then(function (data) {
                  console.error("Could not track " + flight, data);
                });
              }
            })
            .catch(function (e) {
              console.error(e);
            });
        }
        (document.fonts && document.fonts.ready
          ? document.fonts.ready
        : Promise.resolve()
      )
        .then(function () {
          return InPlaneSight.fetchJson("/config");
        })
        .then(function (cfg) {
          CENTER = [cfg.lat, cfg.lon];
          fontThickness = cfg.font_thickness === "broad" ? "broad" : "normal";
          InPlaneSight.configure(cfg);
          var board = document.getElementById("board");
          board.classList.toggle("font-normal", fontThickness === "normal");
          board.classList.toggle("font-broad", fontThickness === "broad");
          initializeLedText();
          var root = document.documentElement,
            s = Math.max(0, Math.min(cfg.flicker_strength || 0, 1));
          root.style.setProperty("--flicker-low", String(1 - s));
          root.style.setProperty("--flicker-mid", String(1 - s * 0.55));
          root.style.setProperty("--flicker-soft", String(1 - s * 0.5));
          root.classList.toggle(
            "flicker-enabled",
            cfg.flicker_enabled === true,
          );
          return startTrackingFromUrl().then(function () {
            fetchAircraft();
            setInterval(fetchAircraft, cfg.refresh_seconds * 1000);
          });
        })
        .catch(function (e) {
          document.getElementById("updated").textContent = "CONFIG FAILED";
          console.error(e);
        });
        addEventListener("resize", function () {
          fitHeadlineText();
          scheduleLedTextRender();
          redrawLogo();
          drawProgress();
        });
      </script>
    </body>
</html>
