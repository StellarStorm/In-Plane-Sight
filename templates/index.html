<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InPlaneSight - Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; }
    #map { width: 100vw; height: 100vh; }
    .home-marker {
      width: 14px;
      height: 14px;
      background: #ffca4f;
      border: 2px solid #fff4c2;
      border-radius: 50%;
      box-shadow: 0 0 4px #ffca4f, 0 0 12px rgba(255, 202, 79, 0.8);
    }

    .aircraft-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #4dffb4;
      text-shadow: 0 0 8px rgba(77, 255, 180, 0.9);
    }

    .maplibregl-popup-content {
      background: rgba(10, 10, 22, 0.95);
      color: #ccc;
      border: 1px solid #4dffb4;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(77, 255, 180, 0.3);
      padding: 10px 14px;
    }
    .maplibregl-popup-tip { display: none; }

    .popup-callsign { font-size: 15px; font-weight: bold; color: #4dffb4; letter-spacing: 0.05em; }
    .popup-type     { font-size: 12px; color: #888; margin-top: 1px; }
    .popup-detail   { font-size: 12px; color: #aaa; margin-top: 4px; }

    #status {
      position: fixed;
      bottom: 38px;
      right: 14px;
      font-family: monospace;
      font-size: 11px;
      color: #555;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">loading...</div>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/js/airline-icons.js"></script>
  <script>
      var statusEl = document.getElementById('status');

    fetch('/config')
      .then(function(r) { return r.json(); })
      .then(function(cfg) { init(cfg); })
      .catch(function(err) {
        statusEl.textContent = 'config fetch failed';
        console.error(err);
      });

    function init(cfg) {
      InPlaneSight.configure(cfg);
      var CENTER     = [cfg.lat, cfg.lon];
      var RADIUS_NM  = cfg.radius_nm;
      var REFRESH_MS = cfg.refresh_seconds * 1000;

      var map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [CENTER[1], CENTER[0]],
        zoom: 8
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      var markers = {};

      function updateIcon(element, heading, category) {
        var helicopter = InPlaneSightAirlines.isHelicopter(category);
        var helicopterState = String(helicopter);
        if (element.dataset.helicopter !== helicopterState) {
          element.innerHTML = '';
          element.dataset.helicopter = helicopterState;
          if (helicopter) {
            var canvas = document.createElement('canvas');
            canvas.style.width = '24px';
            canvas.style.height = '24px';
            element.appendChild(canvas);
            InPlaneSightAirlines.load('HELI').then(function (icon) {
              if (icon && canvas.isConnected) {
                InPlaneSightAirlines.render(canvas, icon, {
                  dotScale: 0.68,
                  showOffLeds: false,
                  glow: true
                });
              }
            });
          } else {
            var plane = document.createElement('div');
            plane.innerHTML = '&#9992;';
            element.appendChild(plane);
          }
        }
        if (!helicopter) {
          element.firstChild.style.transform =
            'rotate(' + ((heading || 0) - 90) + 'deg)';
        }
      }

      function makeIcon(heading, category) {
        var element = document.createElement('div');
        element.className = 'aircraft-icon';
        updateIcon(element, heading, category);
        return element;
      }

      function makePopup(a) {
        var alt  = a.altitude_ft != null ? a.altitude_ft.toLocaleString() + ' ft' : '-- ft';
        var spd  = a.speed_kts   != null ? a.speed_kts + ' kts' : '';
        var type = a.aircraft_type || '';
        var detail = alt + (spd ? ' · ' + spd : '');
        var route = a.origin && a.destination
          ? '<div class="popup-detail">Route: ' +
          escapeHtml(a.origin_display || a.origin) + '-' +
            escapeHtml(a.destination_display || a.destination) + '</div>'
          : '';
        return '<div class="popup-callsign">' + (a.callsign || a.icao) + '</div>'
             + '<div class="popup-type">'     + type                   + '</div>'
             + '<div class="popup-detail">'   + detail                 + '</div>'
             + route;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[character];
        });
      }

      function makeRangeFeature() {
        var originLat = CENTER[0] * Math.PI / 180;
        var originLon = CENTER[1] * Math.PI / 180;
        var angularDistance = RADIUS_NM * 1852 / 6371008.8;
        var coordinates = [];

        for (var bearing = 0; bearing <= 360; bearing += 5) {
          var direction = bearing * Math.PI / 180;
          var latitude = Math.asin(
            Math.sin(originLat) * Math.cos(angularDistance) +
            Math.cos(originLat) * Math.sin(angularDistance) * Math.cos(direction)
          );
          var longitude = originLon + Math.atan2(
            Math.sin(direction) * Math.sin(angularDistance) * Math.cos(originLat),
            Math.cos(angularDistance) - Math.sin(originLat) * Math.sin(latitude)
          );
          coordinates.push([longitude * 180 / Math.PI, latitude * 180 / Math.PI]);
        }

        return {
          type: 'Feature',
          properties: {},
          geometry: { type: 'Polygon', coordinates: [coordinates] }
        };
      }

      function refresh() {
        fetch('/aircraft')
          .then(function(r) { return r.json(); })
          .then(function(aircraft) {
            var seen = {};
            aircraft.forEach(function(a) {
              seen[a.icao] = true;
              var popup = makePopup(a);
              if (markers[a.icao]) {
                markers[a.icao].setLngLat([a.lon, a.lat]);
                updateIcon(markers[a.icao].getElement(), a.heading, a.category);
                markers[a.icao].getPopup().setHTML(popup);
              } else {
                markers[a.icao] = new maplibregl.Marker({
                  element: makeIcon(a.heading, a.category),
                  anchor: 'center'
                })
                  .setLngLat([a.lon, a.lat])
                  .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(popup))
                  .addTo(map);
              }
            });
            Object.keys(markers).forEach(function(icao) {
              if (!seen[icao]) {
                markers[icao].remove();
                delete markers[icao];
              }
            });
            statusEl.textContent = aircraft.length + ' aircraft · ' + InPlaneSight.formatTime(new Date());
          })
          .catch(function(err) {
            console.error(err);
            statusEl.textContent = 'fetch failed · ' + InPlaneSight.formatTime(new Date());
          });
      }

      map.on('load', function () {
        [
          'building',
          'highway_path',
          'highway_minor',
          'highway_major_casing',
          'highway_major_inner',
          'highway_major_subtle',
          'highway_name_other',
          'water_name',
          'railway_transit',
          'railway_transit_dashline',
          'railway_minor',
          'railway_minor_dashline',
          'railway',
          'railway_dashline',
          'place_other',
          'place_suburb',
          'place_village',
          'place_state',
          'place_country_other',
          'place_country_minor',
          'place_country_major'
        ].forEach(function(layerId) {
          if (map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, 'visibility', 'none');
          }
        });

        map.addSource('aircraft-range', {
          type: 'geojson',
          data: makeRangeFeature()
        });
        map.addLayer({
          id: 'aircraft-range-fill',
          type: 'fill',
          source: 'aircraft-range',
          paint: { 'fill-color': '#4dffb4', 'fill-opacity': 0.02 }
        });
        map.addLayer({
          id: 'aircraft-range-outline',
          type: 'line',
          source: 'aircraft-range',
          paint: { 'line-color': '#4dffb4', 'line-width': 1, 'line-opacity': 0.3 }
        });

        var home = document.createElement('div');
        home.className = 'home-marker';
        new maplibregl.Marker({ element: home, anchor: 'center' })
          .setLngLat([CENTER[1], CENTER[0]])
          .addTo(map);

        var latitudeDelta = RADIUS_NM / 60;
        var longitudeDelta = latitudeDelta / Math.cos(CENTER[0] * Math.PI / 180);
        map.fitBounds([
          [CENTER[1] - longitudeDelta, CENTER[0] - latitudeDelta],
          [CENTER[1] + longitudeDelta, CENTER[0] + latitudeDelta]
        ], { padding: 8, duration: 0 });

        refresh();
        setInterval(refresh, REFRESH_MS);
      });
    }
  </script>
</body>
</html>
