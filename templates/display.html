<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlightWall - List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      padding-bottom: 40px;
      background-color: #050510;
      background-image: radial-gradient(circle, #0e0e22 1px, transparent 1px);
      background-size: 6px 6px;
      color: #4dffb4;
      font-family: 'Share Tech Mono', monospace;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(77, 255, 180, 0.25);
    }
    #title {
      font-size: 22px;
      letter-spacing: 0.4em;
      text-shadow: 0 0 18px rgba(77, 255, 180, 0.7);
    }
    #title span {
      margin-left: 16px;
      color: rgba(77, 255, 180, 0.4);
      font-size: 13px;
      letter-spacing: 0.15em;
    }
    #header-right {
      color: rgba(77, 255, 180, 0.5);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }
    #clock { color: rgba(77, 255, 180, 0.8); font-size: 20px; }
    #aircraft-table { width: 100%; border-collapse: collapse; }
    #aircraft-table thead tr { border-bottom: 1px solid rgba(77, 255, 180, 0.15); }
    #aircraft-table thead th {
      padding: 10px 16px;
      color: rgba(77, 255, 180, 0.35);
      font-size: 10px;
      font-weight: normal;
      letter-spacing: 0.2em;
      text-align: left;
    }
    .aircraft-row {
      border-bottom: 1px solid rgba(77, 255, 180, 0.06);
      animation: rowIn 0.4s ease;
      transition: background 0.15s;
    }
    .aircraft-row:hover { background: rgba(77, 255, 180, 0.04); }
    .cell { padding: 8px 16px; font-size: 15px; white-space: nowrap; }
    .cell-logo { width: 58px; padding: 4px 0 4px 16px; }
    .logo-canvas { display: block; width: 42px; height: 42px; }
    .logo-fallback {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(77, 255, 180, 0.55);
      font-size: 20px;
    }
    .cell-callsign {
      font-size: 19px;
      letter-spacing: 0.12em;
      text-shadow: 0 0 10px rgba(77, 255, 180, 0.5);
    }
    .cell-type { color: rgba(77, 255, 180, 0.55); font-size: 13px; }
    .cell-hdg { color: rgba(77, 255, 180, 0.65); }
    .cell-dist { color: rgba(77, 255, 180, 0.4); font-size: 13px; }
    .alt-wrap { display: flex; align-items: center; gap: 10px; }
    .alt-bar { width: 70px; height: 3px; background: rgba(77, 255, 180, 0.12); border-radius: 2px; }
    .alt-bar-fill {
      height: 100%;
      background: #4dffb4;
      border-radius: 2px;
      box-shadow: 0 0 5px rgba(77, 255, 180, 0.7);
    }
    #empty {
      display: none;
      padding: 60px 28px;
      color: rgba(77, 255, 180, 0.2);
      font-size: 14px;
      letter-spacing: 0.2em;
    }
    #status-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 7px 28px;
      border-top: 1px solid rgba(77, 255, 180, 0.08);
      background: rgba(5, 5, 16, 0.95);
      color: rgba(77, 255, 180, 0.25);
      font-size: 10px;
      letter-spacing: 0.15em;
    }
    #status-bar a { color: rgba(77, 255, 180, 0.25); text-decoration: none; }
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">FLIGHTWALL <span>LIVE TRAFFIC</span></div>
    <div id="header-right">
      <div id="clock">--:--:--</div>
      <div id="location">--</div>
    </div>
  </div>

  <table id="aircraft-table">
    <thead>
      <tr>
        <th></th>
        <th>CALLSIGN</th>
        <th>TYPE</th>
        <th>ALTITUDE</th>
        <th>SPEED</th>
        <th>HEADING</th>
        <th>DISTANCE</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty">NO AIRCRAFT IN RANGE</div>

  <div id="status-bar">
    <span id="count">--</span>
    <span id="updated">--</span>
    <span><a href="/">LED</a>&nbsp;&nbsp;<a href="/map">MAP</a></span>
  </div>

  <script src="/static/js/airline-icons.js"></script>
  <script>
    var CENTER = null;
    var REFRESH_MS = 15000;
    var TIME_FORMAT = '24';

    function formatTime(date) {
      return date.toLocaleTimeString([], {
        hour: TIME_FORMAT === '12' ? 'numeric' : '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: TIME_FORMAT === '12'
      });
    }

    function distanceNm(lat1, lon1, lat2, lon2) {
      var radius = 3440.065;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var value = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return radius * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
    }

    function toCompass(heading) {
      var directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return directions[Math.round(heading / 45) % 8];
    }

    function makeTextCell(className, value) {
      var cell = document.createElement('td');
      cell.className = className;
      cell.textContent = value;
      return cell;
    }

    function makeLogoCell(callsign) {
      var cell = document.createElement('td');
      var canvas = document.createElement('canvas');
      cell.className = 'cell-logo';
      canvas.className = 'logo-canvas';
      canvas.setAttribute('aria-label', 'Airline icon');
      cell.appendChild(canvas);
      return { cell: cell, canvas: canvas, callsign: callsign };
    }

    function showLogoFallback(logo) {
      logo.canvas.remove();
      var fallback = document.createElement('div');
      fallback.className = 'logo-fallback';
      fallback.textContent = '\u2708';
      logo.cell.appendChild(fallback);
    }

    function renderLogoCell(logo) {
      FlightWallAirlines.getIcon(logo.callsign).then(function (icon) {
        if (!icon) {
          showLogoFallback(logo);
          return;
        }
        FlightWallAirlines.render(logo.canvas, icon, {
          dotScale: 0.72,
          showOffLeds: false,
          glow: true
        });
        logo.canvas.setAttribute('aria-label', icon.label);
      });
    }

    function buildAltitudeCell(altitude) {
      var percentage = altitude != null ? Math.min(altitude / 45000, 1) : 0;
      var text = altitude != null ? (altitude / 1000).toFixed(1) + 'k ft' : '--';
      var cell = document.createElement('td');
      var wrap = document.createElement('div');
      var bar = document.createElement('div');
      var fill = document.createElement('div');
      var label = document.createElement('span');
      cell.className = 'cell';
      wrap.className = 'alt-wrap';
      bar.className = 'alt-bar';
      fill.className = 'alt-bar-fill';
      fill.style.width = Math.round(percentage * 100) + '%';
      label.textContent = text;
      bar.appendChild(fill);
      wrap.appendChild(bar);
      wrap.appendChild(label);
      cell.appendChild(wrap);
      return cell;
    }

    function renderRows(aircraft) {
      var tbody = document.getElementById('tbody');
      var empty = document.getElementById('empty');
      tbody.innerHTML = '';

      if (aircraft.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      aircraft.forEach(function (item) {
        var row = document.createElement('tr');
        var logo = makeLogoCell(item.callsign);
        var speed = item.speed_kts != null ? item.speed_kts + ' kt' : '--';
        var heading = item.heading != null
          ? toCompass(item.heading) + '  ' + Math.round(item.heading) + '\u00b0'
          : '--';
        var distance = item._dist != null ? Math.round(item._dist) + ' nm' : '--';

        row.className = 'aircraft-row';
        row.appendChild(logo.cell);
        row.appendChild(makeTextCell('cell cell-callsign', item.callsign || item.icao.toUpperCase()));
        row.appendChild(makeTextCell('cell cell-type', item.aircraft_type || '--'));
        row.appendChild(buildAltitudeCell(item.altitude_ft));
        row.appendChild(makeTextCell('cell', speed));
        row.appendChild(makeTextCell('cell cell-hdg', heading));
        row.appendChild(makeTextCell('cell cell-dist', distance));
        tbody.appendChild(row);

        renderLogoCell(logo);
      });
    }

    function refresh() {
      fetch('/aircraft')
        .then(function (response) { return response.json(); })
        .then(function (aircraft) {
          aircraft.forEach(function (item) {
            item._dist = CENTER
              ? distanceNm(CENTER[0], CENTER[1], item.lat, item.lon)
              : null;
          });
          aircraft.sort(function (first, second) {
            return (first._dist || 9999) - (second._dist || 9999);
          });
          renderRows(aircraft);
          document.getElementById('count').textContent = aircraft.length + ' AIRCRAFT';
          document.getElementById('updated').textContent = 'UPDATED ' + formatTime(new Date());
        })
        .catch(function (error) {
          document.getElementById('updated').textContent = 'FETCH FAILED ' + formatTime(new Date());
          console.error(error);
        });
    }

    fetch('/config')
      .then(function (response) { return response.json(); })
      .then(function (config) {
        CENTER = [config.lat, config.lon];
        REFRESH_MS = config.refresh_seconds * 1000;
        TIME_FORMAT = config.time_format === '12' ? '12' : '24';
        document.getElementById('location').textContent =
          config.lat.toFixed(4) + ', ' + config.lon.toFixed(4) + ' / ' + config.radius_nm + 'nm';

        function tick() {
          document.getElementById('clock').textContent = formatTime(new Date());
        }

        tick();
        setInterval(tick, 1000);
        refresh();
        setInterval(refresh, REFRESH_MS);
      })
      .catch(function (error) {
        console.error(error);
      });
  </script>
</body>
</html>
