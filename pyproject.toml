[project]
name = "in-plane-sight"
version = "0.1.0"
description = "Display an LED-like information board of flights currently overhead"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "airportsdata>=20261030",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
swift = [
    "certifi>=2026.7.22",
    "solace-pubsubplus>=1.11.0",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
line_length = 80
